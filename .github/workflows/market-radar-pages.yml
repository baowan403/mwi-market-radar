name: MWI Market Radar Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "13,28,43,58 * * * *"
  workflow_dispatch:
    inputs:
      backfill_stockmarket_7d:
        description: "One-time authorized stockmarket.xin seven-day backfill"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-radar-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      data_changed: ${{ steps.publish-data.outputs.data_changed }}
      data_commit_sha: ${{ steps.publish-data.outputs.data_commit_sha }}
      previous_data_sha: ${{ steps.repair-attempt.outputs.rollback_sha || steps.data-worktree.outputs.previous_data_sha }}
      data_branch_created: ${{ steps.data-worktree.outputs.data_branch_created }}
    steps:
      - name: Checkout source and data history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: market-radar/package-lock.json

      - name: Install dependencies
        working-directory: market-radar
        run: npm ci

      - name: Prepare market-data worktree
        id: data-worktree
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          DATA_WT: ${{ runner.temp }}/market-data-${{ github.run_id }}
        run: |
          set -euo pipefail
          git ls-remote --exit-code origin refs/heads/market-data >/dev/null 2>&1 || true
          git fetch origin market-data:refs/remotes/origin/market-data || true
          if git show-ref --verify --quiet refs/remotes/origin/market-data; then
            git worktree add --detach "$DATA_WT" refs/remotes/origin/market-data
            echo "data_branch_created=false" >> "$GITHUB_OUTPUT"
            echo "previous_data_sha=$(git -C "$DATA_WT" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            git worktree add --detach "$DATA_WT" HEAD
            git -C "$DATA_WT" switch --orphan market-data
            git -C "$DATA_WT" rm -r --cached --ignore-unmatch .
            echo "data_branch_created=true" >> "$GITHUB_OUTPUT"
            echo "previous_data_sha=" >> "$GITHUB_OUTPUT"
          fi
          mkdir -p "$DATA_WT/data"
          echo "path=$DATA_WT" >> "$GITHUB_OUTPUT"

      - name: Require existing market-data on source pushes
        if: github.event_name == 'push'
        working-directory: market-radar
        env:
          DATA_WT: ${{ steps.data-worktree.outputs.path }}
        run: |
          set -euo pipefail
          if [ ! -f "$DATA_WT/data/manifest.json" ]; then
            echo "market-data is not initialized; run workflow_dispatch to bootstrap cloud history."
            exit 1
          fi

      - name: Collect the official snapshot on scheduled or manual runs
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        working-directory: market-radar
        env:
          DATA_WT: ${{ steps.data-worktree.outputs.path }}
        run: |
          set -euo pipefail
          npm run cloud:update -- --data-dir "$DATA_WT/data" --source-url https://www.milkywayidle.com/game_data/marketplace.json --min-quotes 1000

      - name: Backfill the authorized seven-day public history
        if: github.event_name == 'workflow_dispatch' && inputs.backfill_stockmarket_7d == true
        working-directory: market-radar
        env:
          DATA_WT: ${{ steps.data-worktree.outputs.path }}
        run: npm run cloud:backfill-stockmarket -- --data-dir "$DATA_WT/data"

      - name: Repair missing market hours (at most once per six hours)
        id: repair-history
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        working-directory: market-radar
        env:
          DATA_WT: ${{ steps.data-worktree.outputs.path }}
        run: |
          if ! npm run cloud:backfill-stockmarket -- --data-dir "$DATA_WT/data" --repair-gaps; then
            echo "::warning::History repair unavailable; preserving official market collection."
          fi

      - name: Persist repair attempt independently of site deployment
        id: repair-attempt
        if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.repair-history.outcome != 'skipped' }}
        env:
          DATA_WT: ${{ steps.data-worktree.outputs.path }}
        run: |
          set -euo pipefail
          if [ -f "$DATA_WT/data/stockmarket-repair-attempt.json" ]; then
            git -C "$DATA_WT" add -- data/stockmarket-repair-attempt.json
            if ! git -C "$DATA_WT" diff --cached --quiet; then
              git -C "$DATA_WT" config user.name 'github-actions[bot]'
              git -C "$DATA_WT" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git -C "$DATA_WT" commit -m 'chore: record history repair attempt'
              git -C "$DATA_WT" push origin HEAD:market-data
            fi
            echo "rollback_sha=$(git -C "$DATA_WT" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate market-data history
        working-directory: market-radar
        env:
          DATA_WT: ${{ steps.data-worktree.outputs.path }}
        run: npm run cloud:validate -- --data-dir "$DATA_WT/data"

      - name: Copy validated market data into the site
        env:
          DATA_WT: ${{ steps.data-worktree.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/market-radar/public/data"
          cp -R "$DATA_WT/data/." "$GITHUB_WORKSPACE/market-radar/public/data/"

      - name: Validate the site data tree
        working-directory: market-radar
        run: |
          set -euo pipefail
          test -s public/data/manifest.json
          npm run cloud:validate -- --data-dir "$GITHUB_WORKSPACE/market-radar/public/data"

      - name: Stage validated data changes
        id: stage-data
        env:
          DATA_WT: ${{ steps.data-worktree.outputs.path }}
        run: |
          set -euo pipefail
          # Equivalent to `git add -- data`, scoped to the explicit worktree.
          git -C "$DATA_WT" add -- data
          if git -C "$DATA_WT" diff --cached --name-only | grep -q -v '^data/'; then
            echo "Only data/** may be committed"
            exit 1
          fi
          if git -C "$DATA_WT" diff --cached --quiet; then
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run unit tests
        working-directory: market-radar
        run: npm test -- --run

      - name: Build dashboard and userscript
        working-directory: market-radar
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: market-radar/dist

      - name: Commit and publish data-only changes
        id: publish-data
        env:
          DATA_WT: ${{ steps.data-worktree.outputs.path }}
          DATA_CHANGED: ${{ steps.stage-data.outputs.data_changed }}
        run: |
          set -euo pipefail
          if [ "$DATA_CHANGED" = "true" ]; then
            git -C "$DATA_WT" config user.name 'github-actions[bot]'
            git -C "$DATA_WT" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C "$DATA_WT" commit -m 'chore: update public market data'
            # Equivalent to `git push origin HEAD:market-data`, scoped to the worktree.
            git -C "$DATA_WT" push origin HEAD:market-data
          fi
          echo "data_changed=$DATA_CHANGED" >> "$GITHUB_OUTPUT"
          if git -C "$DATA_WT" rev-parse --verify HEAD >/dev/null 2>&1; then
            echo "data_commit_sha=$(git -C "$DATA_WT" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "data_commit_sha=" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  rollback-data:
    if: ${{ always() && needs.deploy.result == 'failure' && needs.build.outputs.data_changed == 'true' && needs.build.outputs.data_branch_created == 'false' && needs.build.outputs.previous_data_sha != '' }}
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository for rollback
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Revert the published market-data commit
        env:
          DATA_COMMIT_SHA: ${{ needs.build.outputs.data_commit_sha }}
          PREVIOUS_DATA_SHA: ${{ needs.build.outputs.previous_data_sha }}
        run: |
          set -euo pipefail
          git fetch origin refs/heads/market-data:refs/remotes/origin/market-data
          CURRENT_SHA="$(git rev-parse refs/remotes/origin/market-data)"
          test "$CURRENT_SHA" = "$DATA_COMMIT_SHA"
          test "$PREVIOUS_DATA_SHA" != ""
          git switch --detach "$CURRENT_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git revert --no-edit "$DATA_COMMIT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "$PREVIOUS_DATA_SHA^{tree}")"
          git push origin HEAD:market-data
