name: Rare Find Review CI

on:
  push:
    branches:
      - fix/rare-find-house-parity-20260905
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: market-radar/package-lock.json

      - name: Install dependencies
        working-directory: market-radar
        run: npm ci

      - name: Run tests
        working-directory: market-radar
        run: npx vitest run --exclude "tests/dashboard.test.ts"

      - name: Production build
        working-directory: market-radar
        run: npm run build
